<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интеллектуальный помощник формирования рациона питания</title>
</head>
<body>
    <h1>Интеллектуальный помощник формирования рациона питания</h1>

    <h2>Ввод данных пользователя</h2>
    <form>
        <label>Возраст (лет):</label><br>
        <input type="number"><br><br>

        <label>Рост (см):</label><br>
        <input type="number"><br><br>

        <label>Масса тела (кг):</label><br>
        <input type="number"><br><br>

        <label>Цель питания:</label><br>
        <select>
            <option>Снижение</option>
            <option>Поддержание</option>
            <option>Набор</option>
        </select><br><br>

        <button type="button">Сформировать рацион</button>
    </form>

    <h2>Результат</h2>
    <p>Суточная калорийность: ____ ккал</p>
    <p>Рекомендации по рациону</p>
    <p>Пример рациона на день</p>
</body>
</html>
